# Repository name (or owner/repo). Can also be set with REPO in .env
repository: my-repo

repository-secrets:
  - SECRET_1: VALUE_1
  - SECRET_2: VALUE_2

repository-variables:
  - VARIABLE_1: value_1

environment-secrets:
  environment-name-1:
    - SECRET_3: VALUE_3
  environment-name-2:
    - SECRET_4: VALUE_4

environment-variables:
  environment-name-1:
    - VARIABLE_2: value_2
